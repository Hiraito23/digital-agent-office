<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pembaca dokumen</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
  <style>
    :root { --bg: #f4f1ea; --paper: #fff; --ink: #1d1b16; --muted: #6b665a; --line: #e2ddd0; --accent: #c2410c; --code: #f6f3ea; }
    @media (prefers-color-scheme: dark) { :root { --bg: #14110d; --paper: #1d1914; --ink: #ece6d8; --muted: #a39b88; --line: #3a3328; --accent: #fb923c; --code: #262018; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.7 Poppins, system-ui, sans-serif; }
    .bar { position: sticky; top: 0; display: flex; gap: 10px; align-items: center; padding: 10px 16px; background: var(--paper); border-bottom: 1px solid var(--line); }
    .bar .name { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar button, .bar a { font: 500 13px Poppins, sans-serif; padding: 6px 12px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 8px; cursor: pointer; text-decoration: none; }
    .bar .primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    main { max-width: 820px; margin: 24px auto; padding: 36px 44px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; }
    h1, h2, h3, h4 { line-height: 1.3; margin: 1.6em 0 .5em; }
    h1 { font-size: 1.9em; margin-top: 0; }
    h2 { font-size: 1.4em; border-bottom: 1px solid var(--line); padding-bottom: .2em; }
    h3 { font-size: 1.15em; }
    p, ul, ol, blockquote, pre, table { margin: .8em 0; }
    li { margin: .2em 0; }
    a { color: var(--accent); }
    code { background: var(--code); padding: .1em .35em; border-radius: 4px; font-size: .9em; }
    pre { background: var(--code); padding: 14px; border-radius: 8px; overflow-x: auto; }
    pre code { background: none; padding: 0; }
    blockquote { border-left: 4px solid var(--accent); margin-left: 0; padding: .1em 1em; color: var(--muted); }
    table { border-collapse: collapse; width: 100%; font-size: .93em; }
    th, td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
    th { background: var(--code); }
    hr { border: 0; border-top: 1px solid var(--line); margin: 1.6em 0; }
    .err { color: #b91c1c; }
    @media (max-width: 640px) { main { margin: 0; border: 0; border-radius: 0; padding: 22px 16px; } }
    @media print {
      :root { --bg: #fff; --paper: #fff; --ink: #000; --muted: #444; --line: #ccc; --code: #f3f3f3; --accent: #9a3412; }
      .bar { display: none; }
      main { margin: 0; border: 0; padding: 0; max-width: none; }
      pre, table, blockquote { break-inside: avoid; }
      h1, h2, h3 { break-after: avoid; }
      @page { margin: 18mm; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <span class="name" id="name">Memuat…</span>
    <button id="print" class="primary" title="Pilih Simpan sebagai PDF di jendela cetak">🖨 Simpan sebagai PDF</button>
    <a id="dl" href="#" title="Unduh file aslinya">⬇ Unduh file</a>
  </div>
  <main id="doc"></main>
  <script type="module" src="/js/viewer.js"></script>
</body>
</html>
